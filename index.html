<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSD Protokoll</title>
<style>
:root{color-scheme:dark;--bg:#d4d6d9;--p:#2e2e2e;--p2:#3d3d3d;--tx:#f0f0f0;--mu:#a5a5a5;--rd:#e2342b;--gn:#2fb35a;--bl:#3f7be0;--ln:#585858;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#1a1a1a;color:var(--tx);font:16px/1.35 "Roboto","Segoe UI",system-ui,sans-serif;padding:0}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden;background:#1a1a1a}
header{display:flex;align-items:center;gap:2px;padding:4px 8px;background:#1c1c1c;border-bottom:2px solid var(--rd)}
.ic{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:4px 6px;border:0;background:none;color:var(--tx);font:11px inherit}
.ic svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.gr svg{fill:#fff;stroke:none}
header .sp{flex:1}
.pc{text-align:right;padding:0 10px;border-left:1px solid #444;line-height:1.2}.pc b{display:block;font-size:15px}.pc span{font-size:12px;color:var(--mu)}
.st{font-size:11px;color:var(--mu);text-align:right;padding:0 8px}
.clk{text-align:right;font-size:12px;color:var(--mu);padding-left:8px;border-left:1px solid #444}.clk strong{display:block;font:400 26px/1 inherit;color:var(--tx)}
main{flex:1;display:flex;min-height:0}
nav{width:148px;background:#262626;overflow-y:auto;flex:none;display:flex;flex-direction:column}
nav button{display:flex;gap:10px;align-items:center;width:100%;padding:16px 8px;border:0;border-bottom:1px solid #151515;border-left:4px solid var(--rd);background:transparent;color:var(--tx);font:700 14px/1.15 inherit;text-align:left}
nav button.ok{border-left-color:var(--gn)}nav button.on{background:#5c5c5c}
nav i{font:300 26px inherit;font-style:normal;color:#9a9a9a;width:18px;flex:none}
.lg{margin-top:auto;padding:8px;background:#fff}.lg img{width:100%;display:block}
section{flex:1;overflow-y:auto;padding:12px;display:grid;gap:12px;align-content:start;background:#1a1a1a}
.card{background:var(--p);border-radius:3px;padding:12px 16px;border-left:4px solid transparent;box-shadow:0 1px 3px #0006}
.card.ok{border-left-color:var(--gn)}.card.miss{border-left-color:var(--rd)}.card h2 .dot{display:none;margin-left:8px;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--rd);font:700 12px/18px inherit;vertical-align:3px}.card.miss h2 .dot{display:inline-block}
.card h2{margin:0 0 8px;font:400 21px inherit}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px}
label{display:block;font-size:13px;color:var(--mu)}
label.rq:has(:invalid)::after{content:"!";display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;background:var(--rd);color:#fff;font-size:10px;font-weight:700;margin-left:6px;vertical-align:1px}
input,textarea{width:100%;margin-top:2px;padding:7px 2px;border:0;border-bottom:1px solid var(--ln);background:transparent;color:var(--tx);font:18px inherit;border-radius:0}
input:focus,textarea:focus{outline:0;border-bottom:2px solid var(--bl)}
textarea{min-height:70px;resize:vertical;background:#262626;padding:8px}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.b{min-height:48px;padding:0 16px;border:1px solid #666;border-radius:4px;background:var(--p2);color:var(--tx);font:16px inherit}
.b.on{background:var(--bl);border-color:var(--bl);font-weight:600}
.b.red{background:var(--rd);border-color:var(--rd)}
.big{font-size:22px;min-height:56px;padding:0 24px}
.foot{display:flex;gap:10px;justify-content:space-between}
.vg{display:grid;grid-template-columns:1fr 290px;gap:12px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:104px;padding:8px 10px;text-align:left;border:1px solid #111;background:#202020;color:var(--mu);font:13px inherit}
.tile.on{outline:2px solid var(--bl)}.tile em{font-style:normal;font-size:11px}
.tile strong{font:400 40px/1.1 inherit;color:#5ee08a}.tile strong.txt{font-size:16px;color:var(--tx)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#202020;padding:8px;border-radius:4px}
.kp .b{min-height:52px;padding:0;font-size:22px}.kp .w{font-size:13px;min-height:48px;grid-column:span 1}
canvas{width:100%;height:150px;background:#202020;border-radius:4px;touch-action:none;display:block}
svg.body{width:100%;max-width:420px;margin:auto;display:block}
svg.body [data-t]{fill:#444;stroke:#888;stroke-width:1.5;cursor:pointer}
svg.body [data-t].on{fill:var(--rd)}
.hl{display:flex;gap:6px;flex-wrap:wrap}.hl span{background:var(--p2);padding:8px 12px;border-radius:20px}
.hl span button{margin-left:8px;background:none;border:0;color:var(--mu);font-size:18px}
.v{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.tile.m{border-left:3px solid var(--rd)}
details summary{cursor:pointer;color:var(--bl)}
.hl span button.lk{margin:0;color:var(--tx);font-size:16px}
#lk{position:fixed;inset:0;background:#1a1a1a;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
#lk .lgp{background:#fff;padding:10px 18px;border-radius:6px}#lk .lgp img{height:70px;display:block}
#dots{display:flex;gap:14px}#dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mu)}#dots i.f{background:var(--tx);border-color:var(--tx)}
#lk .kp{width:min(300px,100%)}#lk.bad #dots{animation:sh .4s}#lk.bad #dots i{border-color:var(--rd);background:var(--rd)}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .3s;z-index:30;max-width:90%;pointer-events:none}
.paper .warn{margin:10px 0 0;padding:8px 10px;border:2px solid #c0261c;background:#fde7e5;color:#8d1710;font-weight:700}
.paper .mi{color:#c0261c;font-weight:700;font-style:italic}.paper td:has(.mi){background:#fde7e5}
@media (max-width:760px){body{padding:0}#dev{padding:24px 6px 6px;border-radius:24px}#bez{padding:5px;border-radius:14px}nav{width:54px}nav button{padding:14px 4px;font-size:0}nav i{font-size:22px;width:auto;margin:auto}.lg{display:none}.vg{grid-template-columns:1fr}.ic{min-width:44px;font-size:0}.ic svg{width:24px}.pc,.st,.clk span{display:none}}
.pv{position:fixed;inset:0;background:#777;display:none;flex-direction:column;z-index:9}
.pvbar{display:flex;gap:8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#222}
#pvc{flex:1;overflow:auto;padding:12px}
.paper{background:#fff;color:#000;max-width:794px;margin:auto;padding:26px;font:13px/1.4 Arial,Helvetica,sans-serif}
.paper .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #f39c00;padding-bottom:8px}
.paper h1{font-size:22px;margin:0}.paper .ph img{height:64px}
.paper h3{margin:14px 0 4px;padding:3px 8px;background:#f39c00;color:#fff;font-size:13px}
.paper table{width:100%;border-collapse:collapse}
.paper th,.paper td{border:1px solid #444;padding:5px 7px;text-align:left;vertical-align:top}
.paper th{background:#f0f0f0;font-weight:600}.paper td.k{background:#f0f0f0;font-weight:600;width:28%}
.paper .vt td{text-align:center;font-size:16px}
.paper .bx{display:flex;gap:16px;align-items:flex-start}
.paper svg.body{width:210px;max-width:none;margin:0}
.paper svg.body [data-t]{fill:#eee;stroke:#666}.paper svg.body [data-t].on{fill:#e2342b}
.paper .sg{max-height:90px;display:block}.paper .ft{margin-top:12px;font-size:11px;color:#555}
@media print{html,body{height:auto;background:#fff}#app{display:none}#pv{position:static;display:block!important;background:#fff}.pvbar{display:none}#pvc{padding:0;overflow:visible}.paper{max-width:none;padding:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div id="app">
<header><button class="ic gr" data-h="adm"><svg viewBox="0 0 24 24"><path d="M3 3h5v5H3zM9.5 3h5v5h-5zM16 3h5v5h-5zM3 9.5h5v5H3zM9.5 9.5h5v5h-5zM16 9.5h5v5h-5zM3 16h5v5H3zM9.5 16h5v5h-5zM16 16h5v5h-5z"/></svg>Menü</button>
<button class="ic" data-i="0"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 9.5V21h14V9.5M12 12v6M9 15h6"/></svg>Anmeldung</button>
<button class="ic" data-h="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Info</button>
<button class="ic" data-h="na"><svg viewBox="0 0 24 24"><circle cx="10" cy="7" r="3.5"/><path d="M3 21c0-4 3-7 7-7s7 3 7 7M18 3v6M15 6h6"/></svg>Notruf</button>
<button class="ic" data-i="3"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Schnelldoku</button>
<button class="ic" data-i="7"><svg viewBox="0 0 24 24"><path d="M8 4h8v3H8zM6 5.5H5v15h14v-15h-1M12 10v7M8.5 13.5h7"/></svg>Protokoll</button>
<span class="sp"></span><div class="pc"><b id="pn">Neues Protokoll</b><span id="pa"></span></div><div class="st" id="st">WLAN</div><button class="b" id="nw" style="min-height:38px">Neu</button>
<div class="clk"><strong id="ck"></strong><span id="dt"></span></div></header>
<main><nav id="nav"></nav><section id="sec"></section></main></div>
<div id="lk"><div class="lgp"><img src="LOGOX" alt="Kepler-Gymnasium Freudenstadt"></div><h2 style="margin:0;font-weight:400">Zugangscode</h2><div id="dots"></div><div class="kp"><button class="b" data-pk="1">1</button><button class="b" data-pk="2">2</button><button class="b" data-pk="3">3</button><button class="b" data-pk="4">4</button><button class="b" data-pk="5">5</button><button class="b" data-pk="6">6</button><button class="b" data-pk="7">7</button><button class="b" data-pk="8">8</button><button class="b" data-pk="9">9</button><span></span><button class="b" data-pk="0">0</button><button class="b" data-pk="⌫">⌫</button></div></div><div id="ts"></div>
<div class="pv" id="pv"><div class="pvbar"><button class="b red" id="pvp">Drucken / Als PDF speichern</button><button class="b" id="pvx">Zurück zum Protokoll</button></div><div id="pvc"></div></div>

const DEF={roster:[],mass:['Betreuung','Kühlung','Schienung','Eltern benachrichtigt','Arztbesuch empfohlen','Notruf'],erk:['Kopfschmerzen','Übelkeit','Bauchschmerzen','Kreislauf','Atemnot','Allergie','Sonstiges'],ende:['Abholung durch Eltern','Nach Hause geschickt','Rettungsdienst']};

const now=()=>{const d=new Date();return{d:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,t:`${pad(d.getHours())}:${pad(d.getMinutes())}`}};

const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const lst=(b,k)=>[...b,...(S[k]||[]).filter(x=>!b.includes(x))];
const inp=(k,l,t='text',opt)=>`<label class="${opt?'':'rq'}">${l}<input ${opt?'':'required'} data-k="${k}" type="${t}" value="${esc(S[k])}"></label>`;
const ta=(k,l,rq)=>`<label class="${rq?'rq':''}">${l}<textarea ${rq?'required':''} data-k="${k}">${esc(S[k])}</textarea></label>`;
const sel=(k,o)=>`<div class="ch">${o.map(x=>`<button class="b ${S[k]===x?'on':''}" data-s="${k}|${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
const mul=(k,o)=>`<div class="ch">${o.map(x=>`<button class="b ${(S[k]||[]).includes(x)?'on':''}" data-t="${k}|${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
const card=(h,b,key)=>`<div class="card" ${key?`data-ok="${key}"`:''}><h2>${h}<span class="dot">!</span></h2>${b}</div>`;
const VK=[['af','AF','/min'],['puls','Puls','/min'],['rr','Blutdruck','mmHg'],['spo2','SpO₂','%']];
const vnum=v=>/^[\d,\/]/.test(v||'');
const tile=([k,l,u])=>`<button class="tile ${(S.vsel||'af')===k?'on':''} ${F(S[k])?'':'m'}" data-v="${k}"><span>${l} <em>${u}</em></span><strong class="${!S[k]||vnum(S[k])?'':'txt'}">${esc(S[k]||'')}</strong></button>`;
const kp=()=>`<div class="kp nopr">${['7','8','9','4','5','6','1','2','3','0',',','/'].map(x=>`<button class="b" data-kp="${x}">${x}</button>`).join('')}${['nicht gemessen','nicht messbar','low','high','⌫'].map(x=>`<button class="b w" data-kp="${x}">${x}</button>`).join('')}</div>`;
const fig=(ox,names)=>{const[h,c,b,al,ar,ll,lr]=names;const sh=n=>`data-t="reg|${n}" class="${(S.reg||[]).includes(n)?'on':''}"`;
 return `<g transform="translate(${ox},0)"><circle ${sh(h)} cx="50" cy="22" r="16"/><rect ${sh(c)} x="30" y="42" width="40" height="38" rx="6"/><rect ${sh(b)} x="32" y="82" width="36" height="34" rx="6"/><rect ${sh(al)} x="8" y="44" width="18" height="72" rx="8"/><rect ${sh(ar)} x="74" y="44" width="18" height="72" rx="8"/><rect ${sh(ll)} x="31" y="120" width="17" height="90" rx="8"/><rect ${sh(lr)} x="52" y="120" width="17" height="90" rx="8"/></g>`};

 fig(0,['Kopf vorn','Brust','Bauch','Arm rechts (vorn)','Arm links (vorn)','Bein rechts (vorn)','Bein links (vorn)'])+

const OQ=[['o','O – Beginn',['plötzlich','schleichend','vor Minuten','vor Stunden','seit Tagen']],['p','P – Auslöser / Linderung',['Bewegung','Atmung','Ruhe','Wärme','Kälte','nichts']],['q','Q – Art',['stechend','drückend','brennend','krampfartig','dumpf']],['r','R – Ausstrahlung',['keine','Arm','Rücken','Bauch','Kopf']],['s','S – Stärke',['leicht (1–3)','mittel (4–6)','stark (7–10)']],['t','T – Dauer / Verlauf',['dauerhaft','wiederkehrend','unter 1 h','über 1 h']]];
const AM=[['a','A – Allergien'],['m','M – Medikamente'],['pg','P – Patientengeschichte'],['l','L – Letzte Mahlzeit / Trinken'],['e','E – Ereignis'],['rf','R – Risikofaktoren'],['sw','S – Schwangerschaft / Sonstiges']];
const symOk=()=>F(S.sym)||OQ.some(o=>F(S[o[0]]));
const OKC={pers:()=>F(S.name)&&F(S.klasse)&&F(S.geb),eins:()=>F(S.datum)&&F(S.zeit)&&F(S.ort),helf:()=>S.helfer.length>0,anl:()=>F(S.anlass),
 erk:()=>(S.erk||[]).length>0||F(S.erk_txt),vit:()=>VK.every(k=>F(S[k[0]])),pup:()=>F(S.pup),mas:()=>(S.mass||[]).length>0||F(S.mass_txt),
 unfa:()=>F(S.schild)&&F(S.uort),reg:()=>(S.reg||[]).length>0,sym:symOk,am:()=>AM.every(a=>F(S[a[0]])),ende:()=>F(S.ende),sg:()=>F(S.sdat)&&F(S.snam)&&!!S.sig};
const unfNA=()=>S.unf_na||S.anlass==='Erkrankung';
const OK=[()=>OKC.pers()&&OKC.eins(),OKC.helf,()=>OKC.anl()&&(S.anlass!=='Erkrankung'||OKC.erk()),()=>OKC.vit()&&OKC.pup(),OKC.mas,()=>unfNA()||(OKC.unfa()&&OKC.reg()),()=>S.ana_na||(symOk()&&OKC.am()),()=>OKC.ende()&&OKC.sg()];

()=>S.anlass==='Erkrankung'?card('Unfallbericht','<p style="margin:0;color:var(--mu)">Bei einer Erkrankung entfällt dieser Abschnitt.</p>'):card('Unfallbericht',`<div class="ch" style="margin-bottom:8px"><button class="b ${S.unf_na?'on':''}" data-n="unf_na">Kein Unfall – Abschnitt entfällt</button></div>`+(S.unf_na?'':`${ta('schild','Unfallschilderung',1)}${inp('uort','Ort des Unfalls')}`),S.unf_na?'':'unfa')+(S.unf_na?'':card('Verletzte Bereiche antippen',bodySvg()+`<p style="margin:6px 0 0;color:var(--mu)">${(S.reg||[]).map(esc).join(', ')||'Noch keine Auswahl'}</p>`,'reg')),

()=>{const op=T.map((t,i)=>i<7&&!OK[i]()?`<button class="b red" data-i="${i}">${t}</button>`:'').join('');

];
const LE=(k,t,ph)=>card(t,`<div class="hl">${C[k].map((x,i)=>`<span>${esc(x)}<button data-ax="${k}|${i}">✕</button></span>`).join('')||'<span style="background:none;color:var(--mu)">Noch leer</span>'}</div><div class="v" style="margin-top:10px"><label>${ph}<input id="ai_${k}"></label><button class="b on" data-aa="${k}">Hinzufügen</button></div>`);
const ADM=()=>LE('roster','Sanitäter-Liste','Name hinzufügen')+LE('mass','Maßnahmen','Neue Maßnahme')+LE('erk','Erkrankungsarten','Neue Erkrankungsart')+LE('ende','Verbleib (Abschluss)','Neue Option')+`<div class="foot"><button class="b" id="lock">Sperren</button><button class="b on" id="adb">Fertig</button></div>`;
function liveCards(){document.querySelectorAll('.card[data-ok]').forEach(c=>{const ok=!!OKC[c.dataset.ok]();c.classList.toggle('ok',ok);c.classList.toggle('miss',!ok)})}
function nav(){$('#nav').innerHTML=T.map((t,i)=>`<button class="${OK[i]()?'ok':''} ${i===cur&&!adm?'on':''}" data-i="${i}"><i>${i<7?i+1:''}</i>${t}</button>`).join('')+`<div class="lg"><img src="${LOGO}" alt="Kepler-Gymnasium Freudenstadt"></div>`;
 $('#pn').textContent=S.name||'Neues Protokoll';let a='';if(S.geb){const g=new Date(S.geb),n=new Date();a=n.getFullYear()-g.getFullYear()-((n.getMonth()<g.getMonth()||(n.getMonth()==g.getMonth()&&n.getDate()<g.getDate()))?1:0)+' J.'}
 $('#pa').textContent=[a,S.klasse].filter(Boolean).join(' · ');liveCards()}
function draw(){const key=adm?'a':cur,st=lcKey===key?$('#sec').scrollTop:0;lcKey=key;let h=adm?ADM():R[cur]();if(!adm&&cur<7)h+=`<div class="foot"><button class="b" data-g="-1" ${cur?'':'disabled'}>Zurück</button><button class="b on" data-g="1">Weiter</button></div>`;
 $('#sec').innerHTML=h;$('#sec').scrollTop=st;nav();if(!adm&&cur===7)sig()}
function sig(){const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#111';x.lineWidth=5;x.lineCap='round';x.lineJoin='round';
 if(S.sig){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=S.sig}
 let d=0;const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{e.preventDefault();d=1;try{c.setPointerCapture(e.pointerId)}catch(_){}const[a,b]=p(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()};
 c.onpointermove=e=>{if(d){const[a,b]=p(e);x.lineTo(a,b);x.stroke()}};
 const end=()=>{if(!d)return;d=0;S.sig=c.toDataURL('image/png');nav()};c.onpointerup=end;c.onpointercancel=end;
 $('#cl').onclick=()=>{S.sig=null;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);nav()}}
function protocol(){let miss=0,n=0;const ck=c=>c?'☒':'☐',dd=d=>d?d.split('-').reverse().join('.'):'',mi=()=>{miss++;return'<span class="mi">nicht ausgefüllt</span>'},c=x=>F(x)?esc(x):mi(),row=(a,b)=>`<tr><td class="k">${a}</td><td>${c(b)}</td></tr>`,boxes=(l,f)=>l.map(x=>`${ck(f(x))} ${esc(x)}`).join(' &nbsp; '),H=t=>`<h3>${++n}. ${t}</h3>`;
 let h=`<div class="ph"><div><h1>Einsatzprotokoll</h1>Schulsanitätsdienst · Kepler-Gymnasium Freudenstadt</div><img src="${LOGO}" alt="Kepler-Gymnasium Freudenstadt"></div>`;
 h+=H('Patient und Einsatz')+`<table>${row('Name',S.name)}${row('Klasse',S.klasse)}${row('Geburtsdatum',dd(S.geb))}${row('Datum',dd(S.datum))}${row('Uhrzeit',S.zeit)}${row('Einsatzort',S.ort)}</table>`;
 h+=H('Helfer')+`<table>${row('Sanitäter',S.helfer.join(', '))}</table>`;
 h+=H('Anlass')+`<table><tr><td class="k">Anlass</td><td>${ck(S.anlass==='Erkrankung')} Erkrankung &nbsp; ${ck(S.anlass==='Unfall')} Unfall ${S.anlass?'':mi()}</td></tr>${S.anlass==='Erkrankung'?row('Art der Erkrankung',[...(S.erk||[]),S.erk_txt].filter(F).join(', ')):''}</table>`;
 h+=H('Vitalwerte')+`<table class="vt"><tr>${VK.map(k=>`<th>${k[1]} (${k[2]})</th>`).join('')}<th>Pupillenreaktion</th></tr><tr>${VK.map(k=>`<td>${c(S[k[0]])}</td>`).join('')}<td style="font-size:13px">${c(S.pup)}</td></tr></table>`;
 const ml=lst(C.mass,'mass');h+=H('Maßnahmen')+`<table><tr><td>${boxes(ml,x=>(S.mass||[]).includes(x))} ${OKC.mas()?'':mi()}</td></tr><tr><td><b>Sonstiges:</b> ${esc(S.mass_txt)||'–'}</td></tr></table>`;
 h+=H('Unfallbericht')+(unfNA()?'<table><tr><td>Kein Unfall – kein Unfallbericht.</td></tr></table>':`<table>${row('Unfallschilderung',S.schild)}${row('Ort des Unfalls',S.uort)}</table><div class="bx" style="margin-top:6px">${bodySvg()}<div><b>Verletzte Bereiche</b><br>${(S.reg||[]).length?(S.reg||[]).map(esc).join(', '):mi()}</div></div>`);
 if(!S.ana_na&&(symOk()||AM.some(a=>F(S[a[0]])))){const sy=[F(S.sym)?esc(S.sym):'',...OQ.filter(o=>F(S[o[0]])).map(o=>`<i>${o[1].split(' – ')[1]}:</i> ${esc(S[o[0]])}`)].filter(Boolean);
  h+=H('Anamnese (SAMPLER)')+`<table><tr><td class="k">S – Symptome</td><td>${sy.length?sy.join('<br>'):mi()}</td></tr>${AM.map(a=>row(a[1],S[a[0]])).join('')}</table>`}
 h+=H('Abschluss')+`<table><tr><td class="k">Verbleib</td><td>${boxes(!S.ende||C.ende.includes(S.ende)?C.ende:[...C.ende,S.ende],x=>S.ende===x)} ${S.ende?'':mi()}</td></tr>${row('Datum',dd(S.sdat))}${row('Name',S.snam)}<tr><td class="k">Unterschrift</td><td>${S.sig?`<img class="sg" src="${S.sig}" alt="Unterschrift">`:mi()}</td></tr></table>`;
 return `<div class="paper">${miss?`<div class="warn">⚠ Protokoll unvollständig: ${miss} Angabe${miss>1?'n':''} nicht ausgefüllt (rot markiert).</div>`:''}${h}<div class="ft">Erstellt am ${new Date().toLocaleString('de-DE')} · Vertrauliche Gesundheitsdaten – bitte sicher aufbewahren.</div></div>`}
const tog=(k,v)=>{const a=S[k]||[],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);S[k]=a};
const toast=m=>{const t=$('#ts');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,3800)};
const dots=()=>$('#dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pin.length?'f':''}"></i>`).join('');
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){S[k]=e.target.value;nav()}});
document.addEventListener('toggle',e=>{if(e.target.id==='dop')S.dop=e.target.open},true);
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-t]');if(!b)return;const D=b.dataset,id=b.id;
 if(D.pk!==undefined){pin=D.pk==='⌫'?pin.slice(0,-1):(pin.length<4?pin+D.pk:pin);dots();if(pin.length===4){if(pin==='3832'){$('#lk').style.display='none';pin='';dots()}else{$('#lk').classList.add('bad');setTimeout(()=>{$('#lk').classList.remove('bad');pin='';dots()},450)}}return}
 if(D.i!==undefined){adm=false;cur=+D.i;return draw()}
 if(D.g){cur+=+D.g;return draw()}
 if(D.h==='adm'){adm=!adm;return draw()}
 if(D.h==='info')return toast('Schritte links der Reihe nach ausfüllen. Rot = offen, grün = vollständig. Menü-Symbol links oben: Listen bearbeiten.');
 if(D.h==='na'){if(!(S.mass||[]).includes('Notruf'))tog('mass','Notruf');adm=false;cur=4;return draw()}
 if(D.v){S.vsel=D.v;return draw()}
 if(D.kp){const k=S.vsel||'af',v=S[k]||'',x=D.kp;S[k]=x==='⌫'?(vnum(v)?v.slice(0,-1):''):x.length>1?x:(vnum(v)?v:'')+x;return draw()}
 if(D.t){const[k,v]=D.t.split('|');tog(k,v);return draw()}
 if(D.s){const[k,v]=D.s.split('|');S[k]=S[k]===v?null:v;return draw()}
 if(D.n){S[D.n]=!S[D.n];return draw()}
 if(D.hr){tog('helfer',D.hr);return draw()}
 if(D.x!==undefined){S.helfer.splice(+D.x,1);return draw()}
 if(D.ax){const[k,i]=D.ax.split('|');C[k].splice(+i,1);save();return draw()}
 if(D.aa){const v=$('#ai_'+D.aa).value.trim();if(v&&!C[D.aa].includes(v)){C[D.aa].push(v);save();draw()}return}
 if(id==='ha'){const v=$('#hn').value.trim();if(v&&!S.helfer.includes(v)){S.helfer.push(v);draw()}return}
 if(id==='adb'){adm=false;return draw()}
 if(id==='lock'){adm=false;pin='';dots();$('#lk').style.display='flex';return draw()}
 if(id==='nw'){if(arm){arm=0;S=fresh();cur=0;adm=false;b.textContent='Neu';return draw()}arm=1;b.textContent='Wirklich neu?';setTimeout(()=>{arm=0;b.textContent='Neu'},3000);return}
 if(id==='pd2'){$('#pvc').innerHTML=protocol();$('#pv').style.display='flex'}
 if(id==='pvx')$('#pv').style.display='none';
 if(id==='pvp')window.print()});
const tick=()=>{const n=new Date();$('#ck').textContent=pad(n.getHours())+':'+pad(n.getMinutes());$('#dt').textContent=n.toLocaleDateString('de-DE')};
try{navigator.getBattery().then(b=>{const u=()=>$('#st').textContent='WLAN · '+Math.round(b.level*100)+' %';u();b.onlevelchange=u})}catch(e){}
tick();setInterval(tick,20000);dots();draw();
</script></body></html>
